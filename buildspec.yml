version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      # 루트 패키지(모노레포 루트에 package.json이 없으면 실패하므로 관대하게)
      - npm ci --no-audit --no-fund || true

      # 서버/클라이언트 devDeps 포함 설치(빌드 도구용)
      - npm ci --prefix server --include=dev --no-audit --no-fund
      - npm ci --prefix client --include=dev --no-audit --no-fund

  build:
    commands:
      # 1) 서버 빌드
      - npm --prefix server run build

      # 2) 클라이언트 빌드 (프로덕션 환경변수 주입)
      - VITE_API_URL="https://k-mate.org/api" VITE_CDN_BASE_URL="https://d2eiqf4mjd1sag.cloudfront.net" npm --prefix client run build

      # 3) 배포 산출물 디렉터리 구성
      - rm -rf artifact
      - mkdir -p artifact/server-dist artifact/client-dist artifact/scripts artifact/systemd artifact/nginx

      # 3-1) 서버 산출물: dist + package*.json + prod node_modules
      - cp -r server/dist artifact/server-dist/dist
      - cp server/package*.json artifact/server-dist/
      - (cd artifact/server-dist && npm ci --omit=dev --no-audit --no-fund)

      # 3-2) 클라이언트 산출물
      - cp -r client/dist artifact/client-dist/

      # 3-3) 스크립트/설정/유닛 파일 복사  (⚠️ 디렉터리 '내용물'만 복사)
      - cp -r infrastructure/scripts/*  artifact/scripts/
      - cp -r infrastructure/systemd/*  artifact/systemd/
      - cp -r infrastructure/nginx/*    artifact/nginx/

      # 3-4) 실행 권한
      - find artifact/scripts -type f -name '*.sh' -exec chmod +x {} \;

      # 3-5) appspec.yml 루트에 배치
      - cp appspec.yml artifact/

artifacts:
  base-directory: artifact
  files:
    - '**/*'
