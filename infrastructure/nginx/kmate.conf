# k-mate.conf  (for k-mate.org)

server {
  listen 80;
  server_name k-mate.org www.k-mate.org;

  # ALB 기본 헬스체크
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 애플리케이션 헬스체크 (ALB 대상 그룹 Path로 /app-health 권장)
  location = /app-health {
    access_log off;
    proxy_set_header Host $host;
    proxy_pass http://kmate_upstream/health;
  }

  # 정적 파일 루트 (appspec에서 client-dist → /var/www/k-mate/client 로 복사)
  root  /var/www/k-mate/client;
  index index.html;

  # index.html은 캐시 금지 (새 빌드 즉시 반영)
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # 정적 자원 캐시
  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # ✅ OAuth/인증/백엔드 라우트는 프록시 (SPA가 가로채지 않도록 우선 매칭)
  location ^~ /auth/ {
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout    60s;
    proxy_connect_timeout 3s;
    proxy_pass http://kmate_upstream;
  }

  # 백엔드 API
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout    60s;
    proxy_connect_timeout 3s;
    proxy_pass http://kmate_upstream;
  }

  # ✅ SPA fallback (라우팅 지원) — 존재하는 파일/디렉터리 아니면 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
