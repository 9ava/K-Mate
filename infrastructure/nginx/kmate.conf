# nginx/kmate.conf

upstream kmate_upstream {
  server 127.0.0.1:3000;
  keepalive 64;
}

# (옵션) WebSocket 업그레이드 헤더 매핑
# ※ 대부분의 배포에서 conf.d/*.conf 는 http 블록 안에 포함되므로 사용 가능합니다.
map $http_upgrade $connection_upgrade {
  default      keep-alive;
  "websocket"  upgrade;
}

server {
  listen 80;
  # 로그 가독성을 위해 도메인 명시(둘 다 받되, 없으면 _)
  server_name v0.k-mate.org www.k-mate.org _;

  # 1) ALB 기본 헬스체크(서버 살아있음만 확인): 즉시 200
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 1-2) 앱까지 확인하는 헬스체크(권장): TG Health Check Path를 /app-health 로 설정
  location = /app-health {
    access_log off;
    proxy_set_header Host $host;
    proxy_pass http://kmate_upstream/health;
  }

  # 정적 파일 (SPA 빌드)
  root /var/www/k-mate/client;
  index index.html;

  # 2) index.html 은 캐시 금지(새 배포 즉시 반영)
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # 캐시가 가능한 정적 자원
  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  # 4) 백엔드 API 프록시 (/api/ 이하)
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 필요 시
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_read_timeout    60s;
    proxy_connect_timeout 3s;

    proxy_pass http://kmate_upstream;
  }

  # SPA 라우팅
  location / {
    try_files $uri /index.html;
  }
}
