version: 1
frontend: # 'backend'를 'frontend'로 변경
  phases:
    preBuild:
      commands:
        # Build client first
        - cd client
        - npm ci
        - npm run build
        # Setup server
        - cd ../server
        - npm ci
        # Copy client build to server public directory
        - mkdir -p public
        - cp -r ../client/dist/* public/
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: server # 최종 결과물이 server 디렉토리
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
      - server/node_modules/**/*
