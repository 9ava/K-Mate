version: 1
backend:
  phases:
    preBuild:
      commands:
        # Build client first
        - cd client
        - npm ci
        - npm run build
        # Setup server
        - cd ../server
        - npm ci
        # Copy client build to server public directory
        - mkdir -p public
        - cp -r ../client/dist/* public/
    build:
      commands:
        - npm run build
    postBuild:
      commands:
        - npm run start:prod
  artifacts:
    baseDirectory: server
    files:
      - '**/*'
  cache:
    paths:
      - client/node_modules/**/*
      - server/node_modules/**/*
