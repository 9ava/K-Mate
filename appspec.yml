version: 0.0
os: linux
file_exists_behavior: OVERWRITE

files:
  - source: server-dist/
    destination: /var/www/k-mate/server
  - source: client-dist/
    destination: /var/www/k-mate/client
  - source: systemd/kmate.service
    destination: /etc/systemd/system
  - source: nginx/10-upstreams.conf
    destination: /etc/nginx/conf.d
  # (선택) 스크립트를 서버 고정 경로에 배치하고 절대경로로 실행하고 싶다면:
  # - source: scripts/
  #   destination: /var/www/k-mate/scripts

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 120
      runas: root

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: root

  AfterInstall:
    # ✅ Secrets Manager 번들(JSON)에서 환경 렌더
    - location: scripts/render_env.sh
      timeout: 180
      runas: root
      env:
        - REGION=ap-northeast-2
        - BUNDLE_SECRET_ID=team01 # ← 콘솔에서 확인한 “보안 암호 이름”으로!
        # SSM을 쓰는 구조라면 대신 PREFIX=/kmate/prod 처럼 넘기세요.
        # - PREFIX=/kmate/prod

    - location: scripts/after_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: root
